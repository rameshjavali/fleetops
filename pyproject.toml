[project]
name = "fleetops"
version = "0.1.0"
description = "A small fleet-management application demonstrating Python CI/CD"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "Django>=5.1,<7.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
DJANGO_SETTINGS_MODULE = "fleetops.services.web.settings"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["fleetops"]

[tool.coverage.report]
show_missing = true
fail_under = 75
