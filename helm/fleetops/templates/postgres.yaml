apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fleetops.fullname" . }}-postgres-data
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - {{ .Values.database.accessMode }}
  resources:
    requests:
      storage: {{ .Values.database.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetops.fullname" . }}-db
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fleetops.selectorLabels" (dict "component" "db" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleetops.selectorLabels" (dict "component" "db" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetops.fullname" . }}-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetops.fullname" . }}-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetops.fullname" . }}-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "fleetops.fullname" . }}-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetops.fullname" . }}-db
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fleetops.selectorLabels" (dict "component" "db" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
