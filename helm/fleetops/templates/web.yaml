apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetops.fullname" . }}-web
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      {{- include "fleetops.selectorLabels" (dict "component" "web" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleetops.selectorLabels" (dict "component" "web" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - src/fleetops/services/web/manage.py
            - runserver
            - 0.0.0.0:8000
            - --noreload
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: DATABASE_URL
              value: {{ include "fleetops.databaseUrl" . | quote }}
            - name: BFF_BASE_URL
              value: http://{{ include "fleetops.fullname" . }}-bff:8002
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ .Values.django.allowedHosts | quote }}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetops.fullname" . }}-credentials
                  key: DJANGO_SECRET_KEY
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetops.fullname" . }}-web
  labels:
    {{- include "fleetops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fleetops.selectorLabels" (dict "component" "web" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: {{ .Values.services.web.type }}
