
name: CI and publish image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    name: Tests, lint, and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov pytest-django ruff mypy coverage

      - name: Run tests with coverage
        run: python -m pytest --cov=fleetops --cov-report=xml --cov-report=term-missing -q

      - name: Run Ruff
        run: python -m ruff check src tests migrations

      - name: Run mypy
        run: python -m mypy src/fleetops

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: helm lint ./helm/fleetops

      - name: Render Helm chart
        run: helm template fleetops ./helm/fleetops --namespace fleetops --debug > "$RUNNER_TEMP/fleetops-rendered.yaml"

      - name: Validate Docker build
        run: docker build -f Dockerfile.api -t fleetops:ci .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  sonarqube:
    name: SonarQube analysis
    needs: checks
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov pytest-django coverage

      - name: Run tests for SonarQube coverage
        run: python -m pytest --cov=fleetops --cov-report=xml --cov-report=term-missing -q

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          echo "Running SonarQube analysis"
          python -m pip install sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'fleetops' }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'rameshjavali' }} \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.python.version=3.12 \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }} \
            -Dsonar.token="$SONAR_TOKEN"

  publish-image:
    name: Build and publish image
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name and tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  deploy-minikube:
    name: Deploy to local Minikube
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, fleetops-minikube]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker and Minikube are ready on the runner
        shell: cmd
        run: |
          docker version || exit /b 1
          minikube version || exit /b 1
          minikube status || exit /b 1

      - name: Pull and load the published image into Minikube
        shell: cmd
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          docker pull "%IMAGE%" || exit /b 1
          minikube image load "%IMAGE%" || exit /b 1
          minikube kubectl -- get nodes
          if errorlevel 1 exit /b 1

      - name: Update the existing FleetOps deployments
        shell: cmd
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          for %%D in (api bff web worker) do minikube kubectl -- set image deployment/%%D %%D=%IMAGE% -n fleetops || exit /b 1
          for %%D in (api bff web worker) do minikube kubectl -- rollout status deployment/%%D -n fleetops --timeout=180s || exit /b 1

      - name: Verify deployed workloads
        shell: cmd
        run: |
          minikube kubectl -- get pods,services -n fleetops
          if errorlevel 1 exit /b 1
